[project]
name = "sns-analytics"
version = "0.1.0"
description = "Sip & Script analytics pipeline: loaders + dbt on BigQuery"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery>=3.45,<4",
  "google-cloud-storage>=2.18,<3",
  "google-cloud-secret-manager>=2.20,<3",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "stripe>=15,<16",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "dbt-bigquery>=1.12,<2"]
# The Slack brief / Google Ads job (brief/) ships its own image from brief/requirements.txt; this group
# installs the same packages locally so its tests run from the repo root (pip install -e ".[brief]").
brief = ["google-ads>=33,<34", "anthropic>=1.8,<2", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["loaders*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
