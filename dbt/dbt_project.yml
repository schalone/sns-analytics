name: sns_analytics
version: "1.0"
profile: sns_analytics
model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]
vars:
  ga4_dataset: analytics_313669961
  woo_dataset: sipandscript_new_ds
  ads_customer_id: "1863952460"
  launch_date: "2026-06-19"
  ga4_start_date: "2025-01-01"          # sessions model floor; widen for deeper history
  # Final-review I15a: days of GA4 daily tables the two GA4-backed incremental models (core_sessions,
  # core_session_orders) re-read on an incremental run. After an outage longer than this, rebuild with
  # dbt build --select core_sessions core_session_orders --vars '{ga4_lookback_days: N}'
  ga4_lookback_days: 3
  # Controller ruling (Tasks 13-14): the `google_ads` dataset has no tables until a human
  # authorises the BigQuery Data Transfer. While false, every reference to a `google_ads` source
  # in core_ad_spend.sql and mart_paid_performance.sql is replaced by a typed empty select, so the
  # project builds and produces zero Google rows. Set to true once the transfer has run.
  google_ads_enabled: false
models:
  sns_analytics:
    staging: {+materialized: view, +schema: staging}
    core: {+materialized: table, +schema: core}
    marts: {+materialized: table, +schema: mart}
seeds:
  sns_analytics: {+schema: ops}
