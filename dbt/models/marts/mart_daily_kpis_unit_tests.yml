version: 2

unit_tests:
  - name: mart_daily_kpis_cvr_counts_orders_of_every_metro
    description: >
      Final-review I1. Two sessions and three ticket orders on one date and channel, two of the orders carrying
      a metro. The null-metro row must report cvr = 3 / 2 and channel_ticket_orders = 3 (orders summed over ALL
      metro values); each metro row keeps its own order and has NULL cvr and channel_ticket_orders.
    model: mart_daily_kpis
    given:
      - input: ref('core_sessions')
        rows:
          - {session_key: s1, session_date: 2026-09-01, platform_era: bronco, default_channel_group: Organic Search, engaged: true}
          - {session_key: s2, session_date: 2026-09-01, platform_era: bronco, default_channel_group: Organic Search, engaged: false}
      - input: ref('core_orders')
        rows:
          - {order_key: o1, is_transfer: false, business_date: 2026-09-01, platform_era: bronco, order_type: ticket, seats: 1, gross_revenue: 50.0, net_revenue: 50.0, is_first_order: true, billing_metro_key: null}
          - {order_key: o2, is_transfer: false, business_date: 2026-09-01, platform_era: bronco, order_type: ticket, seats: 2, gross_revenue: 90.0, net_revenue: 90.0, is_first_order: false, billing_metro_key: m-dallas}
          - {order_key: o3, is_transfer: false, business_date: 2026-09-01, platform_era: bronco, order_type: ticket, seats: 1, gross_revenue: 45.0, net_revenue: 45.0, is_first_order: false, billing_metro_key: m-boston}
      - input: ref('core_session_orders')
        rows:
          - {order_key: o1, session_key: s1}
          - {order_key: o2, session_key: s1}
          - {order_key: o3, session_key: s2}
      - input: ref('core_order_items')
        format: sql
        rows: select cast(null as string) as order_key, cast(null as string) as event_key, cast(null as string) as item_type from unnest([1]) where false
      - input: ref('core_events')
        format: sql
        rows: select cast(null as string) as event_key, cast(null as string) as metro_key from unnest([1]) where false
      - input: ref('date_flags')
        format: sql
        rows: select cast(null as date) as date, cast(null as string) as flag from unnest([1]) where false
      - input: ref('core_bookings')
        rows:
          - {booking_key: bk1, order_key: o2, net_distributable: 54, sns_share: 21.6}
    expect:
      # net_distributable/sns_share come from core_bookings aggregated by order_key, so they sit on
      # whichever row that order's own metro lands on -- here o2's booking lands on the m-dallas row,
      # the other two rows have no booking and stay 0.
      rows:
        - {metro_key: null, sessions: 2, orders: 1, ticket_orders: 1, channel_ticket_orders: 3, cvr: 1.5, net_distributable: 0, sns_share: 0}
        - {metro_key: m-boston, sessions: 0, orders: 1, ticket_orders: 1, channel_ticket_orders: null, cvr: null, net_distributable: 0, sns_share: 0}
        - {metro_key: m-dallas, sessions: 0, orders: 1, ticket_orders: 1, channel_ticket_orders: null, cvr: null, net_distributable: 54, sns_share: 21.6}

  - name: mart_daily_kpis_transfers_add_no_orders
    description: >
      A legacy transfer order (is_transfer) is not a purchase: it adds nothing to orders, ticket_orders, seats,
      gross or net revenue, new customers or the conversion numerator. The money its booking took from the
      root order is reported on the transfer's own business date and row: o2 shares o1's date and channel, o3
      sits alone on a later date.
    model: mart_daily_kpis
    given:
      - input: ref('core_sessions')
        rows:
          - {session_key: s1, session_date: 2024-03-01, platform_era: legacy_event_tickets, default_channel_group: Organic Search, engaged: true}
      - input: ref('core_orders')
        rows:
          - {order_key: o1, is_transfer: false, business_date: 2024-03-01, platform_era: legacy_event_tickets, order_type: ticket, seats: 1, gross_revenue: 70.0, net_revenue: 70.0, is_first_order: true, billing_metro_key: null}
          - {order_key: o2, is_transfer: true, business_date: 2024-03-01, platform_era: legacy_event_tickets, order_type: ticket, seats: 1, gross_revenue: 0.0, net_revenue: 0.0, is_first_order: false, billing_metro_key: null}
          - {order_key: o3, is_transfer: true, business_date: 2024-03-05, platform_era: legacy_event_tickets, order_type: ticket, seats: 1, gross_revenue: 0.0, net_revenue: 0.0, is_first_order: false, billing_metro_key: null}
      - input: ref('core_session_orders')
        rows:
          - {order_key: o1, session_key: s1}
          - {order_key: o2, session_key: s1}
      - input: ref('core_order_items')
        format: sql
        rows: select cast(null as string) as order_key, cast(null as string) as event_key, cast(null as string) as item_type from unnest([1]) where false
      - input: ref('core_events')
        format: sql
        rows: select cast(null as string) as event_key, cast(null as string) as metro_key from unnest([1]) where false
      - input: ref('date_flags')
        format: sql
        rows: select cast(null as date) as date, cast(null as string) as flag from unnest([1]) where false
      - input: ref('core_bookings')
        rows:
          - {booking_key: bk1, order_key: o1, net_distributable: 0, sns_share: 0}
          - {booking_key: bk2, order_key: o2, net_distributable: 67.82, sns_share: 27.128}
          - {booking_key: bk3, order_key: o3, net_distributable: 67.67, sns_share: 27.068}
    expect:
      # o1's booking gave its seat and money to o2 (net 0 left on o1); o2's moved money lands on 03-01
      # with o1, o3's on 03-05, a row that exists only because of the transfer and counts no orders.
      rows:
        - {business_date: 2024-03-01, channel_group: Organic Search, orders: 1, ticket_orders: 1, seats: 1, gross_revenue: 70.0, net_revenue: 70.0, new_customers: 1, channel_ticket_orders: 1, cvr: 1.0, net_distributable: 67.82, sns_share: 27.128}
        - {business_date: 2024-03-05, channel_group: Unattributed, orders: 0, ticket_orders: 0, seats: 0, gross_revenue: 0.0, net_revenue: 0.0, new_customers: 0, channel_ticket_orders: 0, cvr: null, net_distributable: 67.67, sns_share: 27.068}
