version: 2

models:
  - name: mart_daily_kpis
    description: >
      Day x channel_group x metro grain. Orders, ticket orders, seats and revenue sit on exactly one row per
      (business_date, platform_era, channel_group, metro_key): the metro of the order's event, else of its billing
      zip, else NULL. Sessions and engaged sessions sit only on the `metro_key is null` row (GA4 geo city is not
      a metro). So order and revenue totals are summed over ALL rows, and only sessions and the CVR use
      `metro_key is null` rows. `channel_ticket_orders` is the ticket orders of that date, platform_era and channel
      summed over ALL metro values, carried on the null-metro row only (NULL on metro rows); `cvr` =
      channel_ticket_orders / sessions on the null-metro row, and a dashboard computes CVR over any window as
      SUM(channel_ticket_orders) / SUM(sessions) over null-metro rows. `cvr` is NULL on metro rows, whenever
      sessions are absent or zero, and on any `business_date` flagged `unreliable_ga4` in the `date_flags` seed
      (the Jun 19-22 GA4 cutover blackout). `ticket_net_revenue` is the net revenue of ticket orders only (the
      numerator for ticket AOV); `aov` is NULL when the cell has no orders. Legacy transfer orders
      (core_orders.is_transfer: a zero-total order that moved a seat to another event) are not purchases and add
      nothing to orders, ticket_orders, seats, gross or net revenue, new_customers or the CVR numerator; the money
      their bookings took from the original order stays in net_distributable and sns_share on the ORIGINAL order's row (acquisition follows the purchase).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - business_date
              - platform_era
              - channel_group
              - metro_key
    columns:
      - name: sessions
        data_tests: [not_null]
      - name: engaged_sessions
        data_tests: [not_null]
      - name: orders
        data_tests: [not_null]
      - name: ticket_orders
        data_tests: [not_null]
      - name: seats
        data_tests: [not_null]
      - name: gross_revenue
        data_tests: [not_null]
      - name: net_revenue
        data_tests: [not_null]
      - name: net_distributable
        description: "Sum of core_bookings.net_distributable (order revenue net of refunds and disputed money, after Stripe fees) for purchase orders in this cell: bookings are aggregated by coalesce(transfer_root_order_key, order_key) first, so a transferred seat's money stays with the original order and no other measure changes."
        data_tests: [not_null]
      - name: sns_share
        description: "40% of net_distributable for orders in this cell, before instructor materials."
        data_tests: [not_null]
      - name: ticket_net_revenue
        data_tests: [not_null]
      - name: new_customers
        data_tests: [not_null]
      - name: channel_ticket_orders
        description: NULL exactly on metro rows; never NULL on the null-metro row.
        data_tests:
          - not_null:
              config:
                where: "metro_key is null"
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: mart_paid_performance
    description: >
      Day x platform x campaign grain. Google sessions/orders are gated behind the
      `google_ads_enabled` var the same way `core_ad_spend` is; while it is false this mart
      produces zero Google rows (and zero rows overall today, since `core_ad_spend` has no spend
      rows until the CSV drop and/or Google Ads transfer have real data). `roas` and `cpa` are
      ratios and are legitimately NULL (no spend, or no orders) rather than 0 or an error. Legacy transfer
      orders (core_orders.is_transfer) add nothing to orders, seats or net_revenue; their bookings' moved
      money counts in sns_share for the campaign of the original (root) order's session.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - platform
              - campaign_id
              - campaign_name
    columns:
      - name: spend
        data_tests: [not_null]
      - name: impressions
        data_tests: [not_null]
      - name: clicks
        data_tests: [not_null]
      - name: sessions
        data_tests: [not_null]
      - name: orders
        data_tests: [not_null]
      - name: seats
        data_tests: [not_null]
      - name: net_revenue
        data_tests: [not_null]
      - name: sns_share
        description: "S&S 40% share of net_distributable of bookings whose purchase order (coalesce(transfer_root_order_key, order_key)) came from sessions of this campaign (net of refunds and disputed money, after Stripe fees, before instructor materials)."
        data_tests: [not_null]
      - name: sns_contribution
        description: "S&S 40% share of bookings from sessions of this campaign, minus the campaign's spend. Session-attributed, so it is not a measure of incrementality. This, not roas, is the decision column."
        data_tests: [not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: mart_orders_reconciliation
    description: >
      Business-date grain, whole history, both eras. Each side is grouped by the date the thing
      itself happened on: orders by the order's own business_date, Stripe transactions by the
      transaction's own business_date, refunds by the refund's own business_date -- never one
      side's date borrowed to bucket another. `variance_pct` and `flagged` compare
      orders_charged_amount (gross, undiscounted by refunds) against stripe_charged_amount (Stripe
      charge/payment amounts, excluding ad hoc charges with no CMS order behind them). `flagged` is
      true only in the bronco era and only when the variance exceeds 1%; it is false, never NULL,
      when there is nothing to compare against. `orders_refunded_amount` and
      `refund_variance_amount` are NULL in the legacy era (the archive carries no refund dates).
      `stripe_gross_less_refunds` and `cms_net_revenue` are the mart's original, less exact columns
      (refunds dated by the order's date, not the refund's), kept for continuity; the columns above
      are the ones to trust for day-level variance.
    columns:
      - name: business_date
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: cms_orders
        description: Count of core_orders rows on this business_date, both eras (the name is kept from when this mart covered only the webapp; in the legacy era it counts archive orders).
        data_tests: [not_null]
      - name: paid_orders
        description: Orders with gross_revenue > 0, by the order's own business_date.
        data_tests: [not_null]
      - name: orders_charged_amount
        description: Sum of gross_revenue of orders on this business_date.
        data_tests: [not_null]
      - name: cms_net_revenue
        description: Sum of net_revenue (gross less refunds, refunds dated by the order's own date, not the refund's). Kept for continuity; see orders_charged_amount and orders_refunded_amount for the columns dated correctly on each side.
        data_tests: [not_null]
      - name: orders_matched_to_stripe
        description: Paid orders on this business_date with at least one Stripe transaction whose source_object is 'charge'.
        data_tests: [not_null]
      - name: stripe_match_rate
        description: orders_matched_to_stripe divided by paid_orders. NULL when there are no paid orders that day.
      - name: stripe_charges
        data_tests: [not_null]
      - name: stripe_charged_amount
        description: Sum of Stripe charge/payment amounts on this business_date, excluding ad hoc charges (match_method = 'adhoc').
        data_tests: [not_null]
      - name: stripe_adhoc_amount
        description: Sum of Stripe charge/payment amounts on this business_date for ad hoc charges, which have no CMS order behind them.
        data_tests: [not_null]
      - name: stripe_refunded_amount
        description: Sum of Stripe refund/payment_refund amounts on this business_date, as a positive number.
        data_tests: [not_null]
      - name: stripe_fees
        data_tests: [not_null]
      - name: stripe_net
        data_tests: [not_null]
      - name: stripe_gross_less_refunds
        data_tests: [not_null]
      - name: orders_refunded_amount
        description: Sum of core_refunds.amount with status Succeeded, by the refund's own business_date. NULL in the legacy era.
      - name: variance_amount
        description: orders_charged_amount minus stripe_charged_amount.
        data_tests: [not_null]
      - name: variance_pct
        description: variance_amount divided by stripe_charged_amount, rounded to 6 decimals. NULL when stripe_charged_amount is 0.
      - name: refund_variance_amount
        description: orders_refunded_amount minus stripe_refunded_amount. NULL in the legacy era.
      - name: flagged
        description: platform_era = 'bronco' and abs(variance_pct) > 0.01. False, never NULL, when variance_pct is undefined.
        data_tests: [not_null]

  - name: mart_event_performance
    description: >
      One row per event with outcomes, pace, contribution and peer benchmarks against events in the
      same metro, category and weekday class within peer_window_days before it. Join to
      core.core_event_daily on event_key for the booking curve. Peers require a non-null metro_key and
      a non-null event_date on both sides and a non-null, matching is_weekend; an event missing either
      has no peers of its own and is nobody's peer. A peer must have taken place (event_date before
      today in New York, or the var as_of_date) and must not have a status in the var
      peer_excluded_statuses (case-insensitive; NULL allowed); an event that sold nothing is still a peer.
      Each benchmark is NULL unless at least peer_min_count peers have a non-null value for that measure;
      medians ignore NULLs.
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: peer_count
        description: Number of peer events.
        data_tests: [not_null]
      - name: peer_count_utilisation
        description: Peers with a non-null utilisation; peer_median_utilisation needs peer_min_count of them.
        data_tests: [not_null]
      - name: peer_count_pace
        description: Peers with a non-null days_before_at_50pct; peer_median_days_before_at_50pct needs peer_min_count of them.
        data_tests: [not_null]
      - name: peer_count_sns_share
        description: Peers with a non-null sns_share_per_available_seat; its median needs peer_min_count of them.
        data_tests: [not_null]
      - name: peer_count_contribution
        description: Peers with a non-null contribution_per_available_seat (NULL while no ad spend data covers the event); its median needs peer_min_count of them.
        data_tests: [not_null]
