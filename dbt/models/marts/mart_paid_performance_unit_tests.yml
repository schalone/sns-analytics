version: 2

unit_tests:
  - name: mart_paid_performance_transfers_add_no_orders
    description: >
      A legacy transfer order (is_transfer) is not a purchase: it adds nothing to a campaign's orders, seats or
      net revenue. Acquisition follows the purchase: sns_share is summed by coalesce(transfer_root_order_key,
      order_key), so the money a transfer booking took from its root counts on the campaign of the root order's
      session, not on the campaign of the transfer's session. o1 (Spring, 03-01) is the root; o2 is its
      transfer, arriving through an Autumn session on 03-05.
    model: mart_paid_performance
    given:
      - input: ref('core_sessions')
        rows:
          - {session_key: s1, session_date: 2024-03-01, default_channel_group: Paid Social, campaign: "Spring", source: facebook, gclid: null, google_ads_campaign_id: null}
          - {session_key: s2, session_date: 2024-03-05, default_channel_group: Paid Social, campaign: "Autumn", source: facebook, gclid: null, google_ads_campaign_id: null}
      - input: ref('core_session_orders')
        rows:
          - {order_key: o1, session_key: s1}
          - {order_key: o2, session_key: s2}
      - input: ref('core_orders')
        rows:
          - {order_key: o1, is_transfer: false, business_date: 2024-03-01, seats: 2, net_revenue: 140.0}
          - {order_key: o2, is_transfer: true, business_date: 2024-03-05, seats: 1, net_revenue: 0.0}
      - input: ref('core_bookings')
        rows:
          - {booking_key: b1, order_key: o1, transfer_root_order_key: null, sns_share: 27.128}
          - {booking_key: b2, order_key: o2, transfer_root_order_key: o1, sns_share: 27.128}
      - input: ref('core_ad_spend')
        rows:
          - {date: 2024-03-01, platform: meta, campaign_id: null, campaign_name: "Spring", campaign_name_norm: "spring", metro_key: null, spend: 10.0, impressions: 1000, clicks: 20}
          - {date: 2024-03-05, platform: meta, campaign_id: null, campaign_name: "Autumn", campaign_name_norm: "autumn", metro_key: null, spend: 5.0, impressions: 500, clicks: 10}
    expect:
      # Spring: one session, one order (o1: 2 seats, 140). Its family's sns_share is b1 + b2 = 27.128 + 27.128 =
      # 54.256; contribution 54.256 - 10 = 44.256. Autumn: one session (o2's), no order, no seat, no revenue and
      # no sns_share (b2's money belongs to the Spring purchase); contribution 0 - 5 = -5.
      rows:
        - {date: 2024-03-01, platform: meta, sessions: 1, orders: 1, seats: 2, net_revenue: 140.0, sns_share: 54.256, sns_contribution: 44.256}
        - {date: 2024-03-05, platform: meta, sessions: 1, orders: 0, seats: 0, net_revenue: 0.0, sns_share: 0.0, sns_contribution: -5.0}
