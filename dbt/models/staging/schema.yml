version: 2

models:
  # Final-review I6: CMS status / source value lists read from the CMS source (sns-analytics-export-api,
  # read-only); file:line evidence per value in final-fix-report.md. Error severity: a new spelling must stop
  # the build rather than be silently miscounted by core_orders / core_events.
  - name: stg_cms__orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: created_at
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [Pending, Paid, Abandoned, Failed, Refunded, Partial Refund, On Hold, Draft, Cancelled]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [webapp, wordpressImport]

  - name: stg_cms__order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: item_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ticket, giftCard, other]

  - name: stg_cms__tickets
    columns:
      - name: ticket_key
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [Held, Pending, Paid, Active, Used, Transferred, Expired, Failed, Refunded, Cancelled]

  - name: stg_cms__refunds
    columns:
      - name: refund_key
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [Pending, Succeeded, Failed]

  - name: stg_cms__promo_redemptions
    columns:
      - name: redemption_key
        data_tests: [unique, not_null]

  - name: stg_cms__gift_cards
    columns:
      - name: gift_card_key
        data_tests: [unique, not_null]

  - name: stg_cms__gift_card_transactions
    columns:
      - name: transaction_key
        data_tests: [unique, not_null]

  - name: stg_cms__checkout_sessions
    columns:
      - name: checkout_session_key
        data_tests: [unique, not_null]

  - name: stg_cms__events
    columns:
      - name: event_key
        data_tests: [unique, not_null]

  - name: stg_cms__venues
    columns:
      - name: venue_key
        data_tests: [unique, not_null]

  - name: stg_cms__metros
    columns:
      - name: metro_key
        data_tests: [unique, not_null]

  - name: stg_cms__instructors
    columns:
      - name: instructor_key
        data_tests: [unique, not_null]

  - name: stg_woo__orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]

  - name: stg_woo__order_line_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]

  - name: stg_woo__products
    columns:
      - name: woo_product_id
        data_tests: [unique, not_null]

  - name: stg_woo__events
    columns:
      - name: woo_event_id
        data_tests: [unique, not_null]

  - name: stg_woo__venues
    columns:
      - name: woo_venue_id
        data_tests: [unique, not_null]

  - name: stg_stripe__balance_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]

  - name: stg_stripe__refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]

  - name: stg_gsc__page_query
    columns:
      - name: key
        data_tests: [unique, not_null]

  - name: stg_spend__csv
    columns:
      - name: key
        data_tests: [unique, not_null]
