version: 2

models:
  - name: core_metros
    columns:
      - name: metro_key
        data_tests: [unique, not_null]

  - name: core_venues
    columns:
      - name: venue_key
        data_tests: [unique, not_null]
      - name: venue_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_archive]

  - name: core_instructors
    columns:
      - name: instructor_key
        data_tests: [unique, not_null]
      - name: instructor_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_archive]

  - name: core_events
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: event_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_archive]
      - name: capacity_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_products, none]
      - name: seats_sold
        description: "Plain count of CMS tickets (Active, Paid, Used) plus legacy ticket lines on completed, refunded or processing orders. It counts ticket lines as sold and does not remove seats later transferred to another class; use core_event_economics.seats_sold for analysis."

  - name: core_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: order_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ticket, gift_card, materials, other]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: [webapp, woocommerce]
      - name: gross_revenue
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: identity_source
        data_tests: [not_null]
      - name: is_transfer
        description: >
          True for a legacy transfer order with a root: a zero-total order that moved a seat of an earlier paid
          order (transfer_root_order_key) to another event. Not a purchase: never is_first_order, and excluded
          from KPI order, ticket-order and seat counts and from customer order counts.
        data_tests: [not_null]

  - name: core_order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_tickets
    columns:
      - name: ticket_key
        data_tests: [unique, not_null]
      - name: event_key
        data_tests:
          - relationships:
              arguments:
                to: ref('core_events')
                field: event_key
              config:
                severity: warn
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_refunds
    columns:
      - name: refund_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_sessions
    columns:
      - name: session_key
        data_tests: [unique, not_null]
      - name: default_channel_group
        data_tests:
          - accepted_values:
              arguments:
                values: [Paid Search, Paid Social, Organic Social, Organic Search, Email, Direct, Referral, Other]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_session_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]

  - name: core_ad_spend
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - platform
              - campaign_name
      # Fix round 2: the true uniqueness grain post-normalisation (campaign_name_norm is what
      # mart_paid_performance's social branch joins on).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - platform
              - campaign_name_norm
    columns:
      - name: spend
        data_tests: [not_null]

  - name: core_search_daily
    description: >
      Search Console page x query per property and day. PARTIAL: the API drops anonymised and low-volume
      queries whenever `query` is requested (2026-06-23..2026-09-13: 5,097 of 11,306 clicks). Search-term
      analysis only; never sum it to a total -- use core_search_totals_daily (property) or core_search_page_daily
      (page) for totals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - property
              - date
              - page
              - query

  - name: core_stripe_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [checkout_session, order_number, woo_metadata, woo_description, adhoc, none]

  - name: core_customer_identity
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: identity_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cms, stripe, cms_import, woo_propagated, woo_surrogate, transfer_parent, unresolved]

  - name: core_seat_transfers
    description: >
      One row per ticket line of a legacy transfer order: a paid zero-total order with a parent and a ticket
      line with value, created when the legacy site moved a seat to another event. root_order_key is the
      original paid order (NULL when none is reachable within five steps). A transfer that was itself transferred
      is superseded. Per root, the other transfers hold seats latest first up to the seats the root bought (all
      their seats when the root has no ticket lines); the rest are superseded and hold nothing.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_key
        data_tests: [not_null]
      - name: seats_held
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: depth
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5

  - name: core_order_item_economics
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: fee_source
        description: >
          'none' means no card payment. It covers orders whose total was zero while their lines
          carried real value -- paid by gift card, credit or voucher, identified by realized_revenue
          > 0 -- and genuine zero-value items, which also have realized_revenue = 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [actual, estimated, none]
      - name: item_kind
        data_tests:
          - accepted_values:
              arguments:
                values: [ticket, gift_card, other]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: booking_kind
        description: >
          purchase: an ordinary line (on a transfer's root, seats and money are what stayed after seats moved
          away). transfer_in: a legacy transfer booking holding a moved seat and the money paid for it, on the
          new event from the transfer date. transfer_superseded: a transfer whose seat moved on again; no seat,
          no money. unpaid_zero_total: a transfer with no paid ancestor, or a zero-total order with ticket
          value and no parent; line value kept as realized revenue with no fee, nature unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [purchase, transfer_in, transfer_superseded, unpaid_zero_total]
      - name: seats_transferred_out
        description: Seats of a root line given up to transfer bookings. seats = seats_purchased - seats_transferred_out on purchase lines.
      - name: transfer_root_order_key
        description: On transfer_in and transfer_superseded rows, the original paid order the seat came from; NULL otherwise.
      - name: realized_revenue
        data_tests: [not_null]
      - name: refunded_amount
        description: >
          Refunded money. Legacy orders with a Stripe match: -sum(amount) over Stripe types refund, payment_refund and
          refund_failure (a failed refund returns the money), split by weight; otherwise, on an order whose status is
          'refunded', each item's own realized revenue. Bronco: succeeded CMS refunds, split by weight.
      - name: disputed_amount
        description: >
          The order's net disputed (chargeback) money in Stripe -- withdrawals (reporting_category 'dispute') less
          reversals ('dispute_reversal') -- split across the order's items by the same weight as refunds and moved
          with a transferred seat like a refund. Normally zero or positive; a net reversal surplus would be negative
          and is not clamped. The dispute fee is in processing_fee, not here. A chargeback does not cancel a seat.
        data_tests: [not_null]
      - name: net_distributable
        description: realized_revenue - refunded_amount - disputed_amount - processing_fee. sns_share is 0.40 of it, instructor_share 0.60.
      # processing_fee can be negative: Stripe returns fees on some refunds, though none exist in
      # today's data. No dbt_utils.accepted_range min_value:0 test here for that reason; plausibility
      # is instead checked by tests/core/assert_processing_fee_plausible.sql (warn).

  - name: core_bookings
    description: "One row per ticket order item. sns_share is 40% of realized revenue less refunds, less disputed (chargeback) money, less Stripe fees. Instructor materials are never subtracted."
    columns:
      - name: disputed_amount
        description: >
          The order's net disputed (chargeback) money in Stripe -- withdrawals (reporting_category 'dispute') less
          reversals ('dispute_reversal') -- split across the order's items by the same weight as refunds and moved
          with a transferred seat like a refund. Normally zero or positive; a net reversal surplus would be negative
          and is not clamped. The dispute fee is in processing_fee, not here. A chargeback does not cancel a seat.
      - name: net_distributable
        description: realized_revenue - refunded_amount - disputed_amount - processing_fee. sns_share is 0.40 of it, instructor_share 0.60.
      - name: booking_kind
        description: >
          purchase: an ordinary line (on a transfer's root, seats and money are what stayed after seats moved
          away). transfer_in: a legacy transfer booking holding a moved seat and the money paid for it, on the
          new event from the transfer date. transfer_superseded: a transfer whose seat moved on again; no seat,
          no money. unpaid_zero_total: a transfer with no paid ancestor, or a zero-total order with ticket
          value and no parent; line value kept as realized revenue with no fee, nature unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [purchase, transfer_in, transfer_superseded, unpaid_zero_total]
      - name: seats_transferred_out
        description: Seats of a root line given up to transfer bookings. seats = seats_purchased - seats_transferred_out on purchase lines.
      - name: transfer_root_order_key
        description: On transfer_in and transfer_superseded rows, the original paid order the seat came from; NULL otherwise.
      - name: booking_key
        data_tests: [unique, not_null]
      - name: fee_source
        description: >
          'none' means no card payment. It covers orders whose total was zero while their lines
          carried real value -- paid by gift card, credit or voucher, identified by realized_revenue
          > 0 -- and genuine zero-value items, which also have realized_revenue = 0.
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: event_key
        data_tests:
          - relationships:
              arguments:
                to: ref('core_events')
                field: event_key
              config:
                severity: warn

  - name: core_ad_spend_allocation
    description: "Allocation convention, not attribution. event_key is null on spend no event absorbed."
    columns:
      - name: spend
        data_tests: [not_null]

  - name: core_event_daily
    description: "Booking curve. Capacity is the final recorded capacity, so pct_sold is capped at 1."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_key, snapshot_date]
    columns:
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: days_until_event
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cumulative_realized_revenue
        description: >
          Despite its name, a net figure: cumulative realized revenue LESS refunds and LESS disputed (chargeback)
          money, by sale date. The name is kept because existing reports read it.

  - name: core_search_totals_daily
    description: >
      Search Console property totals per day (dimensions [date]); complete. The source for every Search Console
      click or impression total.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property, date]

  - name: core_search_page_daily
    description: Search Console clicks and impressions per page and day (dimensions [date, page]); complete per page.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property, date, page]

  - name: core_search_device_country_daily
    description: Search Console clicks and impressions per device and country and day (dimensions [date, device, country]); complete.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property, date, device, country]

  - name: core_event_economics
    description: "Authoritative event outcomes. sns_contribution is null when no ad spend data exists for the selling window; use sns_share_per_available_seat to compare across eras."
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: utilisation_band
        data_tests:
          - accepted_values:
              arguments:
                values: ["<40", "40-60", "60-80", "80-95", "95-100"]
      - name: seats_sold
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: disputed_amount
        description: Sum of the event's bookings' disputed (chargeback) money; net_distributable is already net of it.

  - name: core_customers
    columns:
      - name: customer_hash
        data_tests: [unique, not_null]
      - name: lifetime_realized_revenue
        description: >
          Despite its name, a net figure: realized revenue LESS refunds and LESS disputed (chargeback) money over the
          customer's seat-holding bookings. The name is kept because existing reports read it.
      - name: first_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
