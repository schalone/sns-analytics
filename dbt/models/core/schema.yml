version: 2

models:
  - name: core_metros
    columns:
      - name: metro_key
        data_tests: [unique, not_null]

  - name: core_venues
    columns:
      - name: venue_key
        data_tests: [unique, not_null]
      - name: venue_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_archive]

  - name: core_instructors
    columns:
      - name: instructor_key
        data_tests: [unique, not_null]
      - name: instructor_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_archive]

  - name: core_events
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: event_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_archive]
      - name: capacity_source
        data_tests:
          - accepted_values:
              arguments:
                values: [cms, woo_products, none]
      - name: seats_sold
        description: "Plain count of CMS tickets (Active, Paid, Used) plus legacy ticket lines on completed, refunded or processing orders. Use core_event_economics for analysis."

  - name: core_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: order_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ticket, gift_card, materials, other]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: [webapp, woocommerce]
      - name: gross_revenue
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: identity_source
        data_tests: [not_null]

  - name: core_order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_tickets
    columns:
      - name: ticket_key
        data_tests: [unique, not_null]
      - name: event_key
        data_tests:
          - relationships:
              arguments:
                to: ref('core_events')
                field: event_key
              config:
                severity: warn
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_refunds
    columns:
      - name: refund_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_sessions
    columns:
      - name: session_key
        data_tests: [unique, not_null]
      - name: default_channel_group
        data_tests:
          - accepted_values:
              arguments:
                values: [Paid Search, Paid Social, Organic Social, Organic Search, Email, Direct, Referral, Other]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]

  - name: core_session_orders
    columns:
      - name: order_key
        data_tests: [unique, not_null]

  - name: core_ad_spend
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - platform
              - campaign_name
      # Fix round 2: the true uniqueness grain post-normalisation (campaign_name_norm is what
      # mart_paid_performance's social branch joins on).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - platform
              - campaign_name_norm
    columns:
      - name: spend
        data_tests: [not_null]

  - name: core_search_daily
    description: >
      Search Console page x query per property and day. PARTIAL: the API drops anonymised and low-volume
      queries whenever `query` is requested (2026-06-23..2026-09-13: 5,097 of 11,306 clicks). Search-term
      analysis only; never sum it to a total -- use core_search_totals_daily (property) or core_search_page_daily
      (page) for totals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - property
              - date
              - page
              - query

  - name: core_stripe_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [checkout_session, order_number, woo_metadata, woo_description, adhoc, none]

  - name: core_customer_identity
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: identity_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cms, stripe, cms_import, woo_propagated, woo_surrogate, unresolved]

  - name: core_order_item_economics
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: fee_source
        description: >
          'none' means no card payment. It covers orders whose total was zero while their lines
          carried real value -- paid by gift card, credit or voucher, identified by realized_revenue
          > 0 -- and genuine zero-value items, which also have realized_revenue = 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [actual, estimated, none]
      - name: item_kind
        data_tests:
          - accepted_values:
              arguments:
                values: [ticket, gift_card, other]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: realized_revenue
        data_tests: [not_null]
      # processing_fee can be negative: Stripe returns fees on some refunds, though none exist in
      # today's data. No dbt_utils.accepted_range min_value:0 test here for that reason; plausibility
      # is instead checked by tests/core/assert_processing_fee_plausible.sql (warn).

  - name: core_bookings
    description: "One row per ticket order item. sns_share is 40% of realized revenue less refunds less Stripe fees. Instructor materials are never subtracted."
    columns:
      - name: booking_key
        data_tests: [unique, not_null]
      - name: fee_source
        description: >
          'none' means no card payment. It covers orders whose total was zero while their lines
          carried real value -- paid by gift card, credit or voucher, identified by realized_revenue
          > 0 -- and genuine zero-value items, which also have realized_revenue = 0.
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: event_key
        data_tests:
          - relationships:
              arguments:
                to: ref('core_events')
                field: event_key
              config:
                severity: warn

  - name: core_ad_spend_allocation
    description: "Allocation convention, not attribution. event_key is null on spend no event absorbed."
    columns:
      - name: spend
        data_tests: [not_null]

  - name: core_event_daily
    description: "Booking curve. cumulative_realized_revenue is realized revenue less refunds. Capacity is the final recorded capacity, so pct_sold is capped at 1."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_key, snapshot_date]
    columns:
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: days_until_event
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: core_search_totals_daily
    description: >
      Search Console property totals per day (dimensions [date]); complete. The source for every Search Console
      click or impression total.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property, date]

  - name: core_search_page_daily
    description: Search Console clicks and impressions per page and day (dimensions [date, page]); complete per page.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property, date, page]

  - name: core_search_device_country_daily
    description: Search Console clicks and impressions per device and country and day (dimensions [date, device, country]); complete.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property, date, device, country]

  - name: core_event_economics
    description: "Authoritative event outcomes. sns_contribution is null when no ad spend data exists for the selling window; use sns_share_per_available_seat to compare across eras."
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: platform_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
      - name: utilisation_band
        data_tests:
          - accepted_values:
              arguments:
                values: ["<40", "40-60", "60-80", "80-95", "95-100"]
      - name: seats_sold
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: core_customers
    columns:
      - name: customer_hash
        data_tests: [unique, not_null]
      - name: first_era
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [legacy_event_tickets, bronco]
