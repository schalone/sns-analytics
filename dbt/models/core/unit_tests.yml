        rows: []
      - input: source('public_geo', 'zip_codes')
        rows: []
      - input: ref('core_metros')
        rows: []
      - input: ref('core_customer_identity')
        rows:
          - {order_key: "woo-1", customer_hash: h1, identity_source: stripe}
          - {order_key: "woo-2", customer_hash: h1, identity_source: transfer_parent}
          - {order_key: "woo-5", customer_hash: h5, identity_source: stripe}
          - {order_key: "woo-6", customer_hash: h5, identity_source: stripe}
