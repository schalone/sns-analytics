  - name: event_economics_counts_seat_holding_bookings
    description: >
      bookings and customers count only booking rows that hold seats (seats > 0). A purchase cancelled by a
      refund still holds its seat row and counts, and a chargeback (disputed_amount) is summed like a refund; a root line that gave up every seat to a transfer and a
      superseded transfer do not. Money sums are unaffected (those rows carry zero).
    model: core_event_economics
    given:
      - input: ref('core_events')
        rows:
          - {event_key: E1, title: "Mixed", event_date: "2024-05-04", start_at: "2024-05-04 23:00:00", time_zone: "America/New_York", metro_key: m1, capacity: 10, capacity_source: woo_products, ticket_price: 70, platform_era: legacy_event_tickets, has_event_date: true}
      - input: ref('core_bookings')
        rows:
          - {booking_key: b1, event_key: E1, customer_hash: h1, seats: 2, net_seats: 2, realized_revenue: 140, refunded_amount: 0, disputed_amount: 10, processing_fee: 4.36, fee_source: actual, net_distributable: 125.64, sns_share: 50.256, instructor_share: 75.384, is_cancelled: false}
          - {booking_key: b2, event_key: E1, customer_hash: h2, seats: 0, net_seats: 0, realized_revenue: 0, refunded_amount: 0, disputed_amount: 0, processing_fee: 0, fee_source: actual, net_distributable: 0, sns_share: 0, instructor_share: 0, is_cancelled: false}
          - {booking_key: b3, event_key: E1, customer_hash: h3, seats: 0, net_seats: 0, realized_revenue: 0, refunded_amount: 0, disputed_amount: 0, processing_fee: 0, fee_source: none, net_distributable: 0, sns_share: 0, instructor_share: 0, is_cancelled: true}
          - {booking_key: b4, event_key: E1, customer_hash: h4, seats: 1, net_seats: 0, realized_revenue: 70, refunded_amount: 70, disputed_amount: 0, processing_fee: 2.33, fee_source: actual, net_distributable: -2.33, sns_share: -0.932, instructor_share: -1.398, is_cancelled: true}
      - input: ref('core_event_daily')
        rows: []
    expect:
      # b1 and b4 hold seat rows (seats 2 and 1): bookings 2, customers 2 (h1, h4). b2 (root line that gave up
      # every seat) and b3 (superseded transfer) have seats 0 and are not counted. seats_sold = sum(net_seats)
      # = 2 + 0 = 2; realized 140 + 70 = 210; refunded 70; disputed 10 (b1's chargeback; it holds its seats);
      # net 125.64 - 2.33 = 123.31; sns_share 50.256 - 0.932 = 49.324.
      rows:
        - {event_key: E1, seats_sold: 2, bookings: 2, customers: 2, realized_revenue: 210, refunded_amount: 70, disputed_amount: 10, net_distributable: 123.31, sns_share: 49.324}
