  - name: customer_identity_transfer_takes_root_customer
    description: >
      A transfer order with a root belongs to the root's customer (identity_source transfer_parent), even when
      it carries a hash of its own; when the root is unresolved, so is the transfer. A transfer with no root
      resolves as any other order.
    model: core_customer_identity
    given:
      - input: ref('stg_cms__orders')
        rows: []
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-201", woo_order_id: "201", woo_customer_id: "0"}
          - {order_key: "woo-202", woo_order_id: "202", woo_customer_id: "0"}
          - {order_key: "woo-203", woo_order_id: "203", woo_customer_id: "0"}
          - {order_key: "woo-204", woo_order_id: "204", woo_customer_id: "0"}
          - {order_key: "woo-205", woo_order_id: "205", woo_customer_id: "0"}
          - {order_key: "woo-206", woo_order_id: "206", woo_customer_id: "0"}
      - input: ref('core_stripe_transactions')
        rows:
          - {txn_id: t1, type: charge, source_object: charge, order_key: "woo-201", customer_hash: h201, created_at: "2024-01-01 00:00:00"}
          - {txn_id: t2, type: charge, source_object: charge, order_key: "woo-205", customer_hash: h205, created_at: "2024-01-01 00:00:00"}
          - {txn_id: t3, type: charge, source_object: charge, order_key: "woo-206", customer_hash: h206, created_at: "2024-01-01 00:00:00"}
      - input: ref('core_seat_transfers')
        rows:
          - {order_item_key: "woo-li-202", order_key: "woo-202", root_order_key: "woo-201"}
          - {order_item_key: "woo-li-204", order_key: "woo-204", root_order_key: "woo-203"}
          - {order_item_key: "woo-li-205", order_key: "woo-205", root_order_key: null}
          - {order_item_key: "woo-li-206", order_key: "woo-206", root_order_key: "woo-201"}
    expect:
      rows:
        - {order_key: "woo-201", source_system: woocommerce, customer_hash: h201, identity_source: stripe}
        - {order_key: "woo-202", source_system: woocommerce, customer_hash: h201, identity_source: transfer_parent}
        - {order_key: "woo-203", source_system: woocommerce, customer_hash: null, identity_source: unresolved}
        - {order_key: "woo-204", source_system: woocommerce, customer_hash: null, identity_source: unresolved}
        - {order_key: "woo-205", source_system: woocommerce, customer_hash: h205, identity_source: stripe}
        - {order_key: "woo-206", source_system: woocommerce, customer_hash: h201, identity_source: transfer_parent}

  - name: orders_flag_transfers
    description: >
      is_transfer is true only for a transfer order with a root. A transfer is never a first order, and the
      first-order ranking ignores transfers: woo-2 is dated before its customer's purchase woo-1 here, and
      woo-1 is still the first order. A rootless transfer (woo-5) is an ordinary order.
    model: core_orders
    given:
      - input: ref('stg_cms__orders')
        rows: []
      - input: ref('stg_cms__order_items')
        rows: []
      - input: ref('stg_cms__refunds')
        rows: []
