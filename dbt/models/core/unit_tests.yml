  - name: seat_transfers_find_root_and_hold_seats
    description: >
      A transfer order is a paid zero-total legacy order with a parent and a ticket line with value. Its root is
      the first ancestor with a total above zero, reached through other transfer orders. Per root, transfer lines
      are ranked latest first and hold seats up to the seats the root bought; the rest are superseded. R1 bought
      two seats and one moved (held). R3 bought one seat, moved twice from the same order: the later move holds
      it. R4's seat moved to C4a, then C4a's seat moved to C4b (a chain of two): C4b holds it. U2's parent U1 is a
      zero-total order with no parent, and T2's parent failed, so neither has a root. Z1 has a parent but no
      ticket value and is not a transfer.
