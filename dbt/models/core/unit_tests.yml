version: 2

unit_tests:
  - name: stripe_transactions_resolve_orders
    description: Each join key in priority order; refunds inherit the order of their charge; fee rows match nothing.
    model: core_stripe_transactions
    given:
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: "aaaaaaaa-0000-0000-0000-000000000001", order_number: "SNS-26-000001", status: "Paid", checkout_session_key: "cccccccc-0000-0000-0000-000000000001", source: "webapp", updated_at: "2026-09-01 00:00:00"}
          - {order_key: "aaaaaaaa-0000-0000-0000-000000000002", order_number: "SNS-26-000002", status: "Paid", checkout_session_key: "cccccccc-0000-0000-0000-000000000002", source: "webapp", updated_at: "2026-09-01 00:00:00"}
          - {order_key: "aaaaaaaa-0000-0000-0000-000000000099", order_number: "SNS-26-000099", status: "Paid", checkout_session_key: "cccccccc-0000-0000-0000-000000000001", source: "wordpressImport", updated_at: "2026-09-02 00:00:00"}
      - input: ref('stg_stripe__balance_transactions')
        rows:
          - {txn_id: t1, type: charge, created_at: "2026-09-10 15:00:00", amount: 126, fee: 4, net: 122, source_object: charge, charge_id: ch_1, checkout_session_key: "cccccccc-0000-0000-0000-000000000001", order_number: "SNS-26-000001", customer_hash: h1}
          - {txn_id: t2, type: charge, created_at: "2026-09-10 15:00:00", amount: 50, fee: 2, net: 48, source_object: charge, charge_id: ch_2, order_number: "SNS-26-000002", customer_hash: h2}
          - {txn_id: t3, type: charge, created_at: "2024-05-01 15:00:00", amount: 50, fee: 2, net: 48, source_object: charge, charge_id: ch_3, woo_order_id: "70123", order_ref: "70123", customer_hash: h3}
          - {txn_id: t4, type: charge, created_at: "2017-05-01 15:00:00", amount: 50, fee: 2, net: 48, source_object: charge, charge_id: ch_4, order_ref: "1234", customer_hash: h4}
          - {txn_id: t5, type: charge, created_at: "2026-09-10 15:00:00", amount: 10, fee: 1, net: 9, source_object: charge, charge_id: ch_5, adhoc_charge_key: "dddddddd-0000-0000-0000-000000000001", customer_hash: h5}
          - {txn_id: t6, type: refund, created_at: "2026-09-12 15:00:00", amount: -126, fee: 0, net: -126, source_object: refund, charge_id: ch_1, refund_id: re_1}
          - {txn_id: t7, type: stripe_fee, created_at: "2026-09-12 15:00:00", amount: -5, fee: 0, net: -5, source_id: fee_1}
          - {txn_id: t8, type: charge, created_at: "2026-09-10 15:00:00", amount: 10, fee: 1, net: 9, source_object: charge, charge_id: ch_8, checkout_session_key: "cccccccc-0000-0000-0000-00000000ffff"}
    expect:
      rows:
        - {txn_id: t1, order_key: "aaaaaaaa-0000-0000-0000-000000000001", match_method: checkout_session, customer_hash: h1, platform_era: bronco}
        - {txn_id: t2, order_key: "aaaaaaaa-0000-0000-0000-000000000002", match_method: order_number, customer_hash: h2, platform_era: bronco}
        - {txn_id: t3, order_key: "woo-70123", match_method: woo_metadata, customer_hash: h3, platform_era: legacy_event_tickets}
        - {txn_id: t4, order_key: "woo-1234", match_method: woo_description, customer_hash: h4, platform_era: legacy_event_tickets}
        - {txn_id: t5, order_key: null, match_method: adhoc, customer_hash: h5, platform_era: bronco}
        - {txn_id: t6, order_key: "aaaaaaaa-0000-0000-0000-000000000001", match_method: checkout_session, customer_hash: h1, platform_era: bronco}
        - {txn_id: t7, order_key: null, match_method: none, customer_hash: null, platform_era: bronco}
        - {txn_id: t8, order_key: null, match_method: none, customer_hash: null, platform_era: bronco}

  - name: customer_identity_priority
    description: cms, then stripe, then cms_import, then propagation through the WooCommerce customer id, then surrogate, then unresolved.
    model: core_customer_identity
    given:
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: "aaaaaaaa-0000-0000-0000-000000000001", source: "webapp", customer_hash: cms_hash}
          - {order_key: "aaaaaaaa-0000-0000-0000-000000000077", source: "wordpressImport", wordpress_order_id: "102", customer_hash: import_hash}
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-101", woo_order_id: "101", woo_customer_id: "0"}
          - {order_key: "woo-102", woo_order_id: "102", woo_customer_id: "0"}
          - {order_key: "woo-103", woo_order_id: "103", woo_customer_id: "55"}
          - {order_key: "woo-104", woo_order_id: "104", woo_customer_id: "55"}
          - {order_key: "woo-105", woo_order_id: "105", woo_customer_id: "66"}
          - {order_key: "woo-106", woo_order_id: "106", woo_customer_id: "0"}
          - {order_key: "woo-107", woo_order_id: "107", woo_customer_id: null}
      - input: ref('core_stripe_transactions')
        rows:
          - {txn_id: t1, type: charge, source_object: charge, order_key: "aaaaaaaa-0000-0000-0000-000000000001", customer_hash: stripe_hash_ignored, created_at: "2026-09-01 00:00:00"}
          - {txn_id: t2, type: charge, source_object: charge, order_key: "woo-101", customer_hash: stripe_101, created_at: "2024-01-01 00:00:00"}
          - {txn_id: t3, type: charge, source_object: charge, order_key: "woo-103", customer_hash: stripe_55, created_at: "2024-01-01 00:00:00"}
      - input: ref('core_seat_transfers')
        rows: []
    expect:
      rows:
        - {order_key: "aaaaaaaa-0000-0000-0000-000000000001", source_system: webapp, customer_hash: cms_hash, identity_source: cms}
        - {order_key: "woo-101", source_system: woocommerce, customer_hash: stripe_101, identity_source: stripe}
        - {order_key: "woo-102", source_system: woocommerce, customer_hash: import_hash, identity_source: cms_import}
        - {order_key: "woo-103", source_system: woocommerce, customer_hash: stripe_55, identity_source: stripe}
        - {order_key: "woo-104", source_system: woocommerce, customer_hash: stripe_55, identity_source: woo_propagated}
        - {order_key: "woo-105", source_system: woocommerce, customer_hash: "woo-cust-7f02221b889c10b28db633b93a2041ad", identity_source: woo_surrogate}
        - {order_key: "woo-106", source_system: woocommerce, customer_hash: null, identity_source: unresolved}
        - {order_key: "woo-107", source_system: woocommerce, customer_hash: null, identity_source: unresolved}

  - name: events_union_legacy_and_capacity_fallback
    description: A CMS event imported from WordPress with no capacity borrows it from the archive; an event the CMS never imported appears as woo-ev-<id>; two ticket products sum.
    model: core_events
    given:
      - input: ref('stg_cms__events')
        rows:
          - {event_key: "eeeeeeee-0000-0000-0000-000000000001", title: "Bronco event", event_date: "2026-08-01", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: 20, ticket_price: 70, status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000002", title: "Imported event", event_date: "2025-03-01", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: null, ticket_price: null, wordpress_source_id: "500", status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000003", title: "Zero price import", event_date: "2024-01-10", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: null, ticket_price: 0, wordpress_source_id: "800", status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000004", title: "Free event", event_date: "2026-08-15", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: 10, ticket_price: 0, status: Published}
      - input: ref('stg_cms__tickets')
        rows:
          - {ticket_key: k1, order_key: "aaaaaaaa-0000-0000-0000-000000000001", event_key: "eeeeeeee-0000-0000-0000-000000000001", status: Paid}
          - {ticket_key: k2, order_key: "aaaaaaaa-0000-0000-0000-000000000001", event_key: "eeeeeeee-0000-0000-0000-000000000001", status: Refunded}
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: "aaaaaaaa-0000-0000-0000-000000000001", source: webapp}
      - input: ref('core_venues')
        rows:
          - {venue_key: v1, metro_key: m1, wordpress_source_id: null}
          - {venue_key: "woo-venue-9", metro_key: m2, wordpress_source_id: "9"}
      - input: ref('core_instructors')
        rows:
          - {instructor_key: "woo-org-7", wordpress_source_id: "7"}
      - input: ref('stg_woo__events')
        rows:
          - {woo_event_id: "500", title: "Imported event (archive)", event_date: "2025-03-01", start_at: "2025-03-01 23:00:00", woo_venue_id: "9", woo_organizer_id: "7", event_cost: 60}
          - {woo_event_id: "600", title: "Legacy only", status: publish, event_date: "2024-05-04", start_at: "2024-05-04 22:00:00", woo_venue_id: "9", woo_organizer_id: "7", event_cost: 55}
          - {woo_event_id: "800", title: "Zero price import (archive)", event_date: "2024-01-10", start_at: "2024-01-10 23:00:00", woo_venue_id: "9", woo_organizer_id: "7", event_cost: 45}
      - input: ref('stg_woo__products')
        rows:
          - {woo_product_id: "p1", woo_event_id: "500", product_kind: ticket, ticket_capacity: 16, regular_price: 60, name: "Imported event"}
          - {woo_product_id: "p2", woo_event_id: "600", product_kind: ticket, ticket_capacity: 10, regular_price: 55, name: "Legacy only GA"}
          - {woo_product_id: "p3", woo_event_id: "600", product_kind: ticket, ticket_capacity: 4, regular_price: 75, name: "Legacy only VIP"}
          - {woo_product_id: "p4", woo_event_id: "700", product_kind: ticket, ticket_capacity: 0, regular_price: 40, name: "Old undated workshop"}
          - {woo_product_id: "p5", woo_event_id: "800", product_kind: ticket, ticket_capacity: 12, regular_price: 45, name: "Zero price import"}
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-1", status: completed}
          - {order_key: "woo-2", status: failed}
      - input: ref('stg_woo__order_line_items')
        rows:
          - {order_item_key: "woo-li-1", order_key: "woo-1", woo_product_id: "p2", quantity: 3, subtotal: 150}
          - {order_item_key: "woo-li-2", order_key: "woo-1", woo_product_id: "p1", quantity: 2, subtotal: 120}
          - {order_item_key: "woo-li-3", order_key: "woo-2", woo_product_id: "p2", quantity: 5, subtotal: 275}
    expect:
      # Note: dbt's unit-test compiler derives the comparison column set from the FIRST expected
      # row's keys, then unions all rows positionally -- rows with different key sets both fail to
      # compile and would silently skip comparing columns absent from row 1. All six rows below
      # therefore carry the same 14 keys, in the same order, with the true computed value (title,
      # venue_key, instructor_key, wordpress_source_id, metro_key are null where the underlying data
      # gives no value), even where the rule under test concerns only a few of them.
      #
      # Rows 3 and 4 cover the CMS ticket_price=0 fallback. Row 3 (wordpress_source_id
      # "800", a new archive event/product not reused from 600/700 so the existing 600/700 expected
      # rows are unaffected) has ticket_price: 0 and an archive price of 45 (no order line item on
      # event 800, so the archive price is woo_products.regular_price = event_cost = 45, not a
      # seat-weighted average) -- expected ticket_price is the archive's 45, not 0. Row 4 has
      # ticket_price: 0 and no wordpress_source_id at all -- expected ticket_price stays 0 (a
      # genuinely free event has no archive row to borrow from).
      rows:
        - {event_key: "eeeeeeee-0000-0000-0000-000000000001", event_source: cms, platform_era: bronco, title: "Bronco event", capacity: 20, capacity_source: cms, ticket_price: 70, seats_sold: 1, seats_available: 19, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: null, has_event_date: true}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000002", event_source: cms, platform_era: legacy_event_tickets, title: "Imported event", capacity: 16, capacity_source: woo_products, ticket_price: 60, seats_sold: 2, seats_available: 14, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: "500", has_event_date: true}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000003", event_source: cms, platform_era: legacy_event_tickets, title: "Zero price import", capacity: 12, capacity_source: woo_products, ticket_price: 45, seats_sold: 0, seats_available: 12, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: "800", has_event_date: true}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000004", event_source: cms, platform_era: bronco, title: "Free event", capacity: 10, capacity_source: cms, ticket_price: 0, seats_sold: 0, seats_available: 10, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: null, has_event_date: true}
        - {event_key: "woo-ev-600", event_source: woo_archive, platform_era: legacy_event_tickets, title: "Legacy only", capacity: 14, capacity_source: woo_products, ticket_price: 50, seats_sold: 3, seats_available: 11, venue_key: "woo-venue-9", metro_key: m2, instructor_key: "woo-org-7", wordpress_source_id: "600", has_event_date: true}
        - {event_key: "woo-ev-700", event_source: woo_archive, platform_era: legacy_event_tickets, title: "Old undated workshop", capacity: null, capacity_source: none, ticket_price: 40, seats_sold: 0, seats_available: null, venue_key: null, metro_key: null, instructor_key: null, wordpress_source_id: "700", has_event_date: false}

  - name: events_cms_seats_count_webapp_tickets_only
    description: >
      An event imported from WordPress counts the archive's own ticket-line seats plus the CMS tickets that
      hold a seat on a new-platform order (source 'webapp'). A CMS ticket on an imported ('wordpressImport')
      order is the same legacy seat the archive already counts, and a ticket with no order is not counted.
      Here: 2 archive seats, 2 CMS tickets on a wordpressImport order, 1 on a webapp order, 1 with no order:
      seats_sold 3.
    model: core_events
    given:
      - input: ref('stg_cms__events')
        rows:
          - {event_key: "eeeeeeee-0000-0000-0000-000000000002", title: "Imported event", event_date: "2025-03-01", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: 20, ticket_price: 60, wordpress_source_id: "500", status: Published}
      - input: ref('stg_cms__tickets')
        rows:
          - {ticket_key: k1, order_key: imp1, event_key: "eeeeeeee-0000-0000-0000-000000000002", status: Paid}
          - {ticket_key: k2, order_key: imp1, event_key: "eeeeeeee-0000-0000-0000-000000000002", status: Paid}
          - {ticket_key: k3, order_key: web1, event_key: "eeeeeeee-0000-0000-0000-000000000002", status: Paid}
          - {ticket_key: k4, order_key: null, event_key: "eeeeeeee-0000-0000-0000-000000000002", status: Paid}
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: imp1, source: wordpressImport}
          - {order_key: web1, source: webapp}
      - input: ref('core_venues')
        rows:
          - {venue_key: v1, metro_key: m1, wordpress_source_id: null}
      - input: ref('core_instructors')
        rows: []
      - input: ref('stg_woo__events')
        rows:
          - {woo_event_id: "500", title: "Imported event (archive)", event_date: "2025-03-01", start_at: "2025-03-01 23:00:00", event_cost: 60}
      - input: ref('stg_woo__products')
        rows:
          - {woo_product_id: "p1", woo_event_id: "500", product_kind: ticket, ticket_capacity: 16, regular_price: 60, name: "Imported event"}
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-1", status: completed}
      - input: ref('stg_woo__order_line_items')
        rows:
          - {order_item_key: "woo-li-1", order_key: "woo-1", woo_product_id: "p1", quantity: 2, subtotal: 120}
    expect:
      rows:
        - {event_key: "eeeeeeee-0000-0000-0000-000000000002", seats_sold: 3, seats_available: 17}

  - name: events_undated_wordpress_event_is_legacy
    description: >
      An event with no date that came from WordPress (it has a wordpress_source_id) is legacy_event_tickets
      whatever its source, CMS or archive. An undated CMS event with no WordPress id falls to bronco.
    model: core_events
    given:
      - input: ref('stg_cms__events')
        rows:
          - {event_key: "eeeeeeee-0000-0000-0000-000000000009", title: "Undated import", event_date: null, time_zone: "America/New_York", venue_key: v1, capacity: 10, ticket_price: 50, wordpress_source_id: "900", status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000010", title: "Undated new", event_date: null, time_zone: "America/New_York", venue_key: v1, capacity: 10, ticket_price: 50, wordpress_source_id: null, status: Published}
      - input: ref('stg_cms__tickets')
        rows: []
      - input: ref('stg_cms__orders')
        rows: []
      - input: ref('core_venues')
        rows:
          - {venue_key: v1, metro_key: m1, wordpress_source_id: null}
      - input: ref('core_instructors')
        rows: []
      - input: ref('stg_woo__events')
        rows: []
      - input: ref('stg_woo__products')
        rows: []
      - input: ref('stg_woo__orders')
        rows: []
      - input: ref('stg_woo__order_line_items')
        rows: []
    expect:
      rows:
        - {event_key: "eeeeeeee-0000-0000-0000-000000000009", platform_era: legacy_event_tickets, has_event_date: false}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000010", platform_era: bronco, has_event_date: false}

  - name: refunds_on_imported_orders_are_legacy
    description: >
      A refund's era is its order's era. A refund on a CMS order imported from WordPress (source
      'wordpressImport', which core_orders leaves out) is legacy_event_tickets; only a refund with no order at
      all defaults to bronco.
    model: core_refunds
    given:
      - input: ref('stg_cms__refunds')
        rows:
          - {refund_key: r1, order_key: web1, amount: 10, status: Succeeded, created_at: "2026-09-01 00:00:00"}
          - {refund_key: r2, order_key: imp1, amount: 10, status: Succeeded, created_at: "2026-09-01 00:00:00"}
          - {refund_key: r3, order_key: null, amount: 10, status: Succeeded, created_at: "2026-09-01 00:00:00"}
      - input: ref('core_orders')
        rows:
          - {order_key: web1, platform_era: bronco}
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: web1, source: webapp}
          - {order_key: imp1, source: wordpressImport}
    expect:
      rows:
        - {refund_key: r1, platform_era: bronco}
        - {refund_key: r2, platform_era: legacy_event_tickets}
        - {refund_key: r3, platform_era: bronco}

  - name: tickets_on_imported_orders_are_legacy
    description: >
      A ticket's era is its order's era. A ticket on a CMS order imported from WordPress (source
      'wordpressImport', which core_orders leaves out) is legacy_event_tickets; only a ticket with no order at
      all defaults to bronco.
    model: core_tickets
    given:
      - input: ref('stg_cms__tickets')
        rows:
          - {ticket_key: k1, order_key: web1, status: Paid}
          - {ticket_key: k2, order_key: imp1, status: Paid}
          - {ticket_key: k3, order_key: null, status: Paid}
      - input: ref('core_orders')
        rows:
          - {order_key: web1, platform_era: bronco}
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: web1, source: webapp}
          - {order_key: imp1, source: wordpressImport}
    expect:
      rows:
        - {ticket_key: k1, platform_era: bronco}
        - {ticket_key: k2, platform_era: legacy_event_tickets}
        - {ticket_key: k3, platform_era: bronco}

  - name: order_items_legacy_event_join_is_deduplicated
    description: Two core_events rows can share a wordpress_source_id (e.g. a CMS-imported event and its archive-only counterpart); the legacy branch must resolve to one line item, carrying the CMS event's key, not one row per matching event.
    model: core_order_items
    given:
      - input: ref('stg_cms__order_items')
        rows: []
      - input: ref('core_events')
        rows:
          - {event_key: "eeeeeeee-0000-0000-0000-000000000001", wordpress_source_id: "500", event_source: cms}
          - {event_key: "woo-ev-500", wordpress_source_id: "500", event_source: woo_archive}
      - input: ref('stg_woo__products')
        rows:
          - {woo_product_id: "p1", woo_event_id: "500", product_kind: ticket}
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-1", status: completed}
      - input: ref('stg_woo__order_line_items')
        rows:
          - {order_item_key: "woo-li-1", order_key: "woo-1", woo_product_id: "p1", quantity: 1, unit_price: 50, line_total: 50}
    expect:
      rows:
        - {order_item_key: "woo-li-1", event_key: "eeeeeeee-0000-0000-0000-000000000001", platform_era: legacy_event_tickets}

  - name: order_item_economics_bronco_split
    description: >
      Order-level discount, service fee and Stripe fee are split across items by line value; 60/40
      applies after the fee. A bronco item's cancellation is decided by its own ticket status alone:
      order F below is fully refunded by amount (a Succeeded CMS refund equal to the line value) but
      its ticket is Active, so the item is not cancelled and keeps its 60/40 split on the resulting
      negative net.
    model: core_order_item_economics
    given:
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: A, source: webapp, status: Paid, created_at: "2026-09-10 14:00:00", paid_at: "2026-09-10 14:01:00", subtotal: 130, discount: 10, service_fee: 6, total: 126}
          - {order_key: F, source: webapp, status: Refunded, created_at: "2026-09-11 14:00:00", paid_at: "2026-09-11 14:01:00", subtotal: 50, discount: 0, service_fee: 0, total: 50}
      - input: ref('stg_cms__order_items')
        rows:
          - {order_item_key: A1, order_key: A, item_type: ticket, ticket_key: T1, event_key: E1, quantity: 1, line_total: 65}
          - {order_item_key: A2, order_key: A, item_type: ticket, ticket_key: T2, event_key: E1, quantity: 1, line_total: 65}
          - {order_item_key: F1, order_key: F, item_type: ticket, ticket_key: TF1, event_key: E1, quantity: 1, line_total: 50}
      - input: ref('stg_cms__refunds')
        rows:
          - {refund_key: RF1, order_key: F, amount: 50, status: Succeeded}
      - input: ref('stg_cms__tickets')
        rows:
