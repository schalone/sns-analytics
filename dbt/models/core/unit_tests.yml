  - name: events_union_legacy_and_capacity_fallback
    description: A CMS event imported from WordPress with no capacity borrows it from the archive; an event the CMS never imported appears as woo-ev-<id>; two ticket products sum.
    model: core_events
    given:
      - input: ref('stg_cms__events')
        rows:
          - {event_key: "eeeeeeee-0000-0000-0000-000000000001", title: "Bronco event", event_date: "2026-08-01", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: 20, ticket_price: 70, status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000002", title: "Imported event", event_date: "2025-03-01", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: null, ticket_price: null, wordpress_source_id: "500", status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000003", title: "Zero price import", event_date: "2024-01-10", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: null, ticket_price: 0, wordpress_source_id: "800", status: Published}
          - {event_key: "eeeeeeee-0000-0000-0000-000000000004", title: "Free event", event_date: "2026-08-15", start_time: "18:00:00", end_time: "20:00:00", time_zone: "America/New_York", venue_key: v1, capacity: 10, ticket_price: 0, status: Published}
      - input: ref('stg_cms__tickets')
        rows:
          - {ticket_key: k1, event_key: "eeeeeeee-0000-0000-0000-000000000001", status: Paid}
          - {ticket_key: k2, event_key: "eeeeeeee-0000-0000-0000-000000000001", status: Refunded}
      - input: ref('core_venues')
        rows:
          - {venue_key: v1, metro_key: m1, wordpress_source_id: null}
          - {venue_key: "woo-venue-9", metro_key: m2, wordpress_source_id: "9"}
      - input: ref('core_instructors')
        rows:
          - {instructor_key: "woo-org-7", wordpress_source_id: "7"}
      - input: ref('stg_woo__events')
        rows:
          - {woo_event_id: "500", title: "Imported event (archive)", event_date: "2025-03-01", start_at: "2025-03-01 23:00:00", woo_venue_id: "9", woo_organizer_id: "7", event_cost: 60}
          - {woo_event_id: "600", title: "Legacy only", status: publish, event_date: "2024-05-04", start_at: "2024-05-04 22:00:00", woo_venue_id: "9", woo_organizer_id: "7", event_cost: 55}
          - {woo_event_id: "800", title: "Zero price import (archive)", event_date: "2024-01-10", start_at: "2024-01-10 23:00:00", woo_venue_id: "9", woo_organizer_id: "7", event_cost: 45}
      - input: ref('stg_woo__products')
        rows:
          - {woo_product_id: "p1", woo_event_id: "500", product_kind: ticket, ticket_capacity: 16, regular_price: 60, name: "Imported event"}
          - {woo_product_id: "p2", woo_event_id: "600", product_kind: ticket, ticket_capacity: 10, regular_price: 55, name: "Legacy only GA"}
          - {woo_product_id: "p3", woo_event_id: "600", product_kind: ticket, ticket_capacity: 4, regular_price: 75, name: "Legacy only VIP"}
          - {woo_product_id: "p4", woo_event_id: "700", product_kind: ticket, ticket_capacity: 0, regular_price: 40, name: "Old undated workshop"}
          - {woo_product_id: "p5", woo_event_id: "800", product_kind: ticket, ticket_capacity: 12, regular_price: 45, name: "Zero price import"}
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-1", status: completed}
          - {order_key: "woo-2", status: failed}
      - input: ref('stg_woo__order_line_items')
        rows:
          - {order_item_key: "woo-li-1", order_key: "woo-1", woo_product_id: "p2", quantity: 3, subtotal: 150}
          - {order_item_key: "woo-li-2", order_key: "woo-1", woo_product_id: "p1", quantity: 2, subtotal: 120}
          - {order_item_key: "woo-li-3", order_key: "woo-2", woo_product_id: "p2", quantity: 5, subtotal: 275}
    expect:
      # Note: dbt's unit-test compiler derives the comparison column set from the FIRST expected
      # row's keys, then unions all rows positionally -- rows with different key sets both fail to
      # compile and would silently skip comparing columns absent from row 1. All six rows below
      # therefore carry the same 14 keys, in the same order, with the true computed value (title,
      # venue_key, instructor_key, wordpress_source_id, metro_key are null where the underlying data
      # gives no value) rather than the brief's originally sparser per-row column sets.
      #
      # Fix round 1: rows 3 and 4 cover the CMS ticket_price=0 fallback. Row 3 (wordpress_source_id
      # "800", a new archive event/product not reused from 600/700 so the existing 600/700 expected
      # rows are unaffected) has ticket_price: 0 and an archive price of 45 (no order line item on
      # event 800, so the archive price is woo_products.regular_price = event_cost = 45, not a
      # seat-weighted average) -- expected ticket_price is the archive's 45, not 0. Row 4 has
      # ticket_price: 0 and no wordpress_source_id at all -- expected ticket_price stays 0 (a
      # genuinely free event has no archive row to borrow from).
      rows:
        - {event_key: "eeeeeeee-0000-0000-0000-000000000001", event_source: cms, platform_era: bronco, title: "Bronco event", capacity: 20, capacity_source: cms, ticket_price: 70, seats_sold: 1, seats_available: 19, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: null, has_event_date: true}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000002", event_source: cms, platform_era: legacy_event_tickets, title: "Imported event", capacity: 16, capacity_source: woo_products, ticket_price: 60, seats_sold: 2, seats_available: 14, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: "500", has_event_date: true}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000003", event_source: cms, platform_era: legacy_event_tickets, title: "Zero price import", capacity: 12, capacity_source: woo_products, ticket_price: 45, seats_sold: 0, seats_available: 12, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: "800", has_event_date: true}
        - {event_key: "eeeeeeee-0000-0000-0000-000000000004", event_source: cms, platform_era: bronco, title: "Free event", capacity: 10, capacity_source: cms, ticket_price: 0, seats_sold: 0, seats_available: 10, venue_key: v1, metro_key: m1, instructor_key: null, wordpress_source_id: null, has_event_date: true}
        - {event_key: "woo-ev-600", event_source: woo_archive, platform_era: legacy_event_tickets, title: "Legacy only", capacity: 14, capacity_source: woo_products, ticket_price: 50, seats_sold: 3, seats_available: 11, venue_key: "woo-venue-9", metro_key: m2, instructor_key: "woo-org-7", wordpress_source_id: "600", has_event_date: true}
        - {event_key: "woo-ev-700", event_source: woo_archive, platform_era: legacy_event_tickets, title: "Old undated workshop", capacity: null, capacity_source: none, ticket_price: 40, seats_sold: 0, seats_available: null, venue_key: null, metro_key: null, instructor_key: null, wordpress_source_id: "700", has_event_date: false}

  - name: order_items_legacy_event_join_is_deduplicated
    description: Two core_events rows can share a wordpress_source_id (e.g. a CMS-imported event and its archive-only counterpart); the legacy branch must resolve to one line item, carrying the CMS event's key, not one row per matching event.
    model: core_order_items
    given:
      - input: ref('stg_cms__order_items')
        rows: []
      - input: ref('core_events')
        rows:
          - {event_key: "eeeeeeee-0000-0000-0000-000000000001", wordpress_source_id: "500", event_source: cms}
          - {event_key: "woo-ev-500", wordpress_source_id: "500", event_source: woo_archive}
      - input: ref('stg_woo__products')
        rows:
          - {woo_product_id: "p1", woo_event_id: "500", product_kind: ticket}
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-1", status: completed}
      - input: ref('stg_woo__order_line_items')
        rows:
          - {order_item_key: "woo-li-1", order_key: "woo-1", woo_product_id: "p1", quantity: 1, unit_price: 50, line_total: 50}
    expect:
      rows:
        - {order_item_key: "woo-li-1", event_key: "eeeeeeee-0000-0000-0000-000000000001", platform_era: legacy_event_tickets}

  - name: order_item_economics_bronco_split
    description: >
      Order-level discount, service fee and Stripe fee are split across items by line value; 60/40
      applies after the fee. A bronco item's cancellation is decided by its own ticket status alone:
      order F below is fully refunded by amount (a Succeeded CMS refund equal to the line value) but
      its ticket is Active, so the item is not cancelled and keeps its 60/40 split on the resulting
      negative net.
    model: core_order_item_economics
    given:
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: A, source: webapp, status: Paid, created_at: "2026-09-10 14:00:00", paid_at: "2026-09-10 14:01:00", subtotal: 130, discount: 10, service_fee: 6, total: 126}
          - {order_key: F, source: webapp, status: Refunded, created_at: "2026-09-11 14:00:00", paid_at: "2026-09-11 14:01:00", subtotal: 50, discount: 0, service_fee: 0, total: 50}
      - input: ref('stg_cms__order_items')
        rows:
          - {order_item_key: A1, order_key: A, item_type: ticket, ticket_key: T1, event_key: E1, quantity: 1, line_total: 65}
          - {order_item_key: A2, order_key: A, item_type: ticket, ticket_key: T2, event_key: E1, quantity: 1, line_total: 65}
          - {order_item_key: F1, order_key: F, item_type: ticket, ticket_key: TF1, event_key: E1, quantity: 1, line_total: 50}
      - input: ref('stg_cms__refunds')
        rows:
          - {refund_key: RF1, order_key: F, amount: 50, status: Succeeded}
      - input: ref('stg_cms__tickets')
        rows:
          - {ticket_key: T1, status: Paid}
          - {ticket_key: T2, status: Used}
          - {ticket_key: TF1, status: Active}
      - input: ref('core_stripe_transactions')
        rows:
          - {txn_id: t1, type: charge, source_object: charge, order_key: A, amount: 126, fee: 4, net: 122}
          - {txn_id: t2, type: charge, source_object: charge, order_key: F, amount: 50, fee: 1.75, net: 48.25}
      - input: ref('stg_woo__orders')
        rows: []
      - input: ref('stg_woo__order_line_items')
        rows: []
      - input: ref('stg_woo__products')
        rows: []
      - input: ref('core_events')
        rows: []
    expect:
      rows:
        - {order_item_key: A1, source_system: webapp, platform_era: bronco, item_kind: ticket, event_key: E1, purchase_date: "2026-09-10", seats: 1, list_value: 65, discount: 5, service_fee: 3, realized_revenue: 63, refunded_amount: 0, processing_fee: 2, fee_source: actual, net_distributable: 61, sns_share: 24.4, instructor_share: 36.6, is_cancelled: false}
        - {order_item_key: A2, source_system: webapp, platform_era: bronco, item_kind: ticket, event_key: E1, purchase_date: "2026-09-10", seats: 1, list_value: 65, discount: 5, service_fee: 3, realized_revenue: 63, refunded_amount: 0, processing_fee: 2, fee_source: actual, net_distributable: 61, sns_share: 24.4, instructor_share: 36.6, is_cancelled: false}
        - {order_item_key: F1, source_system: webapp, platform_era: bronco, item_kind: ticket, event_key: E1, purchase_date: "2026-09-11", seats: 1, list_value: 50, discount: 0, service_fee: 0, realized_revenue: 50, refunded_amount: 50, processing_fee: 1.75, fee_source: actual, net_distributable: -1.75, sns_share: -0.7, instructor_share: -1.05, is_cancelled: false}

  - name: order_item_economics_zero_value_order
    description: Review focus 2. A comp order worth nothing must not divide by zero; the seat still counts; there is no card payment so no fee.
    model: core_order_item_economics
    given:
      - input: ref('stg_cms__orders')
        rows:
          - {order_key: Z, source: webapp, status: Paid, created_at: "2026-09-10 14:00:00", paid_at: null, subtotal: 0, discount: 0, service_fee: 0, total: 0}
      - input: ref('stg_cms__order_items')
        rows:
          - {order_item_key: Z1, order_key: Z, item_type: ticket, ticket_key: T9, event_key: E1, quantity: 1, line_total: 0}
          - {order_item_key: Z2, order_key: Z, item_type: ticket, ticket_key: T8, event_key: E1, quantity: 1, line_total: 0}
      - input: ref('stg_cms__refunds')
        rows: []
      - input: ref('stg_cms__tickets')
        rows: []
      - input: ref('core_stripe_transactions')
        rows: []
      - input: ref('stg_woo__orders')
        rows: []
      - input: ref('stg_woo__order_line_items')
        rows: []
      - input: ref('stg_woo__products')
