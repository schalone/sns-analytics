  - name: order_item_economics_transferred_seats
    description: >
      A legacy transfer order (total 0, parent = the original paid order) moves a seat, and the money paid for
      it, to another event. Money moved from a root line is that line's per-seat realized revenue, refund, fee
      and discount times the seats it gives up; shares are recomputed from the moved amounts. A: one of two
      seats moved. B: both seats moved to a pricier event (the transfer's own line value is not revenue). C:
      the same seat moved twice from the same order; the later transfer holds it, the earlier is superseded.
      D: a chain (R4 -> C4a -> C4b); C4b holds the seat. E: a zero-total order with no parent, and a transfer
      whose parent is that order, have no root and keep their line value with no fee. F: a refunded root; the
      refund moves with the seat and cancels the transfer booking. G: a root with two lines gives up its seat
      from the line whose key sorts first. H: a transfer order whose own status is refunded is cancelled.
      A root line whose every seat was given up keeps no money and no seat but is not cancelled.
