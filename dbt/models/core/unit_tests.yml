  - name: ad_spend_split_by_seats_within_metro_day
    description: >
      Metro spend is divided among that metro's events by seats sold that day. Spend with no metro is divided
      among all events. Spend nobody can absorb stays unallocated. E4 has no metro, so it can absorb only the
      national (no-metro) google spend, never the m1 meta spend, even though it sold seats on the same day:
      recomputed by hand below since adding E4's seat brings the national split's denominator from 4 to 5. E5
      is in metro m2 (the same metro as the 09-02 spend) but its only booking that day has net_seats 0 (a
      cancelled booking), so it still cannot absorb any of that day's spend, which stays unallocated exactly
      as it did before E5 was added.
    model: core_ad_spend_allocation
    given:
      - input: ref('core_ad_spend')
        rows:
          - {date: "2026-09-01", platform: meta, metro_key: m1, campaign_name: c1, spend: 60}
          - {date: "2026-09-01", platform: meta, metro_key: m1, campaign_name: c2, spend: 30}
          - {date: "2026-09-01", platform: google, metro_key: null, campaign_name: c3, spend: 40}
          - {date: "2026-09-02", platform: meta, metro_key: m2, campaign_name: c4, spend: 25}
      - input: ref('core_bookings')
        rows:
          - {booking_key: b1, event_key: E1, sale_date: "2026-09-01", net_seats: 2}
          - {booking_key: b2, event_key: E2, sale_date: "2026-09-01", net_seats: 1}
          - {booking_key: b3, event_key: E3, sale_date: "2026-09-01", net_seats: 1}
          - {booking_key: b4, event_key: E1, sale_date: "2026-09-01", net_seats: 0}
          - {booking_key: b5, event_key: null, sale_date: "2026-09-01", net_seats: 5}
          - {booking_key: b6, event_key: E4, sale_date: "2026-09-01", net_seats: 1}
          - {booking_key: b7, event_key: E5, sale_date: "2026-09-02", net_seats: 0}
      - input: ref('core_events')
        rows:
          - {event_key: E1, metro_key: m1, has_event_date: true}
          - {event_key: E2, metro_key: m1, has_event_date: true}
          - {event_key: E3, metro_key: m2, has_event_date: true}
          - {event_key: E4, metro_key: null, has_event_date: true}
          - {event_key: E5, metro_key: m2, has_event_date: true}
    expect:
      # 2026-09-01 m1 meta spend (60+30=90) splits only across m1 events by seats: E1=2, E2=1, total 3.
      # E1 = 90 * 2/3 = 60. E2 = 90 * 1/3 = 30. E4 has no metro so it is not part of this split.
      # 2026-09-01 national google spend (40) splits across every event that sold seats that day,
      # regardless of metro: E1=2, E2=1, E3=1, E4=1, total 5 (was 4 before E4's seat was added).
      # E1 = 40 * 2/5 = 16. E2 = 40 * 1/5 = 8. E3 = 40 * 1/5 = 8. E4 = 40 * 1/5 = 8.
      # Day totals still conserve: m1 (90) + national (40) = 130 = 60+30+16+8+8+8.
      # 2026-09-02 m2 meta spend (25): E5 is in m2 but sold 0 net seats that day (b7 is cancelled), so
      # the sales CTE's having sum(net_seats) > 0 excludes it; no event absorbs the spend, unchanged
      # from before E5 was added.
      rows:
        - {date: "2026-09-01", platform: meta, metro_key: m1, event_key: E1, spend: 60}
        - {date: "2026-09-01", platform: meta, metro_key: m1, event_key: E2, spend: 30}
        - {date: "2026-09-01", platform: google, metro_key: null, event_key: E1, spend: 16}
        - {date: "2026-09-01", platform: google, metro_key: null, event_key: E2, spend: 8}
        - {date: "2026-09-01", platform: google, metro_key: null, event_key: E3, spend: 8}
        - {date: "2026-09-01", platform: google, metro_key: null, event_key: E4, spend: 8}
        - {date: "2026-09-02", platform: meta, metro_key: m2, event_key: null, spend: 25}

