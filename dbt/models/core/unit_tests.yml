  - name: order_item_economics_disputes_and_refund_failures
    description: >
      Dispute money is identified by Stripe reporting_category 'dispute' (a withdrawal, negative amount) or
      'dispute_reversal' (money returned, positive amount). An order's disputed_amount is its net disputed money,
      split across its items by the same weight as refunds; the dispute fee is already in processing_fee and is not
      counted again. net_distributable = realized - refunded - disputed - fee. A chargeback does not cancel a seat.
      A failed refund returns the money: refund_failure (positive amount) reduces the refunded total. woo-d1: a
      withdrawal of 50 and no reversal, split 30 / 20 over two lines worth 60 and 40. woo-d2: a withdrawal of 50
      and a reversal of 50 (net 0; the dispute fee and its reversal cancel out too). woo-d3: a refund of 30 and a
      refund_failure of +30 (refunded 0). woo-d4: a root that bought 2 seats with a withdrawal of 70 gives one seat to
      a transfer; the dispute moves per seat with the seat, like a refund. Bronco order B: disputes apply to
      new-platform orders too.
