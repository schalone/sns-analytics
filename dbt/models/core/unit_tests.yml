  - name: seat_transfers_find_root_and_hold_seats
    description: >
      A transfer order is a paid zero-total legacy order with a parent and a ticket line with value. Its root is
      the first ancestor with a total above zero, reached through other transfer orders. Per root, transfer lines
      are ranked latest first and hold seats up to the seats the root bought; the rest are superseded. R1 bought
      two seats and one moved (held). R3 bought one seat, moved twice from the same order: the later move holds
      it. R4's seat moved to C4a, then C4a's seat moved to C4b (a chain of two): C4b holds it. U2's parent U1 is a
      zero-total order with no parent, and T2's parent failed, so neither has a root. Z1 has a parent but no
      ticket value and is not a transfer.
    model: core_seat_transfers
    given:
      - input: ref('stg_woo__orders')
        rows:
          - {order_key: "woo-r1", status: completed, total: 140, parent_order_key: null, created_at: "2024-03-01 15:00:00", paid_at: "2024-03-01 15:00:30"}
          - {order_key: "woo-c1", status: completed, total: 0, parent_order_key: "woo-r1", created_at: "2024-03-05 15:00:00", paid_at: null}
          - {order_key: "woo-r3", status: completed, total: 70, parent_order_key: null, created_at: "2024-03-01 15:00:00", paid_at: "2024-03-01 15:00:30"}
          - {order_key: "woo-c3a", status: completed, total: 0, parent_order_key: "woo-r3", created_at: "2024-03-05 15:00:00", paid_at: null}
          - {order_key: "woo-c3b", status: completed, total: 0, parent_order_key: "woo-r3", created_at: "2024-03-09 15:00:00", paid_at: null}
          - {order_key: "woo-r4", status: completed, total: 70, parent_order_key: null, created_at: "2024-03-01 15:00:00", paid_at: "2024-03-01 15:00:30"}
          - {order_key: "woo-c4a", status: completed, total: 0, parent_order_key: "woo-r4", created_at: "2024-03-05 15:00:00", paid_at: null}
          - {order_key: "woo-c4b", status: processing, total: 0, parent_order_key: "woo-c4a", created_at: "2024-03-09 15:00:00", paid_at: null}
          - {order_key: "woo-u1", status: completed, total: 0, parent_order_key: null, created_at: "2024-03-01 15:00:00", paid_at: null}
          - {order_key: "woo-u2", status: completed, total: 0, parent_order_key: "woo-u1", created_at: "2024-03-05 15:00:00", paid_at: null}
          - {order_key: "woo-f1", status: failed, total: 70, parent_order_key: null, created_at: "2024-03-01 15:00:00", paid_at: null}
          - {order_key: "woo-t2", status: completed, total: 0, parent_order_key: "woo-f1", created_at: "2024-03-05 15:00:00", paid_at: null}
          - {order_key: "woo-z1", status: completed, total: 0, parent_order_key: "woo-r1", created_at: "2024-03-06 15:00:00", paid_at: null}
      - input: ref('stg_woo__order_line_items')
        rows:
          - {order_item_key: "woo-li-r1", order_key: "woo-r1", woo_product_id: p1, quantity: 2, line_total: 140}
          - {order_item_key: "woo-li-c1", order_key: "woo-c1", woo_product_id: p2, quantity: 1, line_total: 70}
          - {order_item_key: "woo-li-r3", order_key: "woo-r3", woo_product_id: p1, quantity: 1, line_total: 70}
          - {order_item_key: "woo-li-c3a", order_key: "woo-c3a", woo_product_id: p2, quantity: 1, line_total: 70}
