  - name: customers_ignore_transfer_orders
    description: >
      A customer with one purchase and two transfers made one order and is not a repeat customer. The purchase
      bought one seat on E1 and moved it: the later transfer (E2) holds it, the earlier (E3) is superseded.
      Seats, events, money and home metro come only from bookings that hold seats, so E1 and E3 do not count.
    model: core_customers
