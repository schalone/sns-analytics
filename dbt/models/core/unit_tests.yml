        rows:
          - {order_key: "woo-1", woo_order_id: "1", status: completed, total: 70, created_at: "2024-03-01 15:00:00", paid_at: "2024-03-01 15:00:30"}
          - {order_key: "woo-2", woo_order_id: "2", status: completed, total: 0, created_at: "2024-02-01 15:00:00", paid_at: null}
          - {order_key: "woo-5", woo_order_id: "5", status: completed, total: 0, created_at: "2024-01-01 15:00:00", paid_at: null}
