  - name: order_item_economics_legacy_zero_total_and_multi_line
    description: >
      A legacy line's realized revenue is always its own archive line_total, never the order's total: order
      Z1 has a WooCommerce total of 0 but real line value (paid by gift card, credit or voucher), so its
      items keep their full realized revenue, pay no fee (no card payment, so fee_source is 'none'), and are
      not cancelled. Order Z2 has the same shape but status 'refunded' with no matched Stripe refund, so each
      of its items refunds its OWN realized revenue in full (not a share of the unreliable order total) and
      is cancelled. Order M1 has a matched Stripe charge and a partial Stripe refund, split across its two
      lines by weight, same as before. Order S1's single line has subtotal below its own line_total (an
      archive data quirk); list_value takes the larger of the two so realized revenue is still exactly the
      line_total and discount is never negative.
