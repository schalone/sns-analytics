      rule cancels the item on its own; P3's line_total is 0 so it does not change the split (and hence the
      expected values) for P1/P2. dbt's unit-test compiler derives the comparison column set from the first
      expected row and every row must supply it, so all expected rows here share one column set: P1/P2/P3
