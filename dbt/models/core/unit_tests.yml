  - name: seat_transfers_edge_cases
    description: >
      (a) Root woo-1000 bought 2 seats and one seat moved twice, woo-1000 -> woo-1001 -> woo-1002: woo-1001 was
      itself transferred, so it is superseded before the latest-first walk and holds nothing; woo-1002 holds 1 and
      the root keeps its other seat. (b) Root woo-1010 has no ticket lines: its transfer holds its own seat. (c)
      woo-1021's parent does not exist: no root. (d) A chain of six transfers above paid order woo-1030: woo-1031
      to woo-1035 are within five steps and resolve to it; woo-1031 to woo-1034 were themselves transferred and
      are superseded, woo-1035 holds the seat, and woo-1036 (six steps up) has no root. (e) Root woo-1040 bought
      3; the later transfer (woo-1042, 2 seats) holds 2 and the earlier (woo-1041, 2 seats) holds the remaining
      1 and is not superseded. (f) woo-99 and woo-100 share a timestamp: the numeric order id breaks the tie,
      so woo-100 ranks first and holds the root's only seat.
