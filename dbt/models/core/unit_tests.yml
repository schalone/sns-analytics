          - {order_item_key: "woo-li-c4b", order_key: "woo-c4b", woo_product_id: p3, quantity: 1, line_total: 70}
          - {order_item_key: "woo-li-u1", order_key: "woo-u1", woo_product_id: p1, quantity: 1, line_total: 65}
          - {order_item_key: "woo-li-u2", order_key: "woo-u2", woo_product_id: p2, quantity: 1, line_total: 65}
